name: CI

# The library built and packed as nuget.org would receive it, and the tests
# run against a real SQL Server in a container.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build and pack the NuGet package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # packages.lock.json is the record of what the package depends on;
      # locked mode fails instead of resolving anything it does not name.
      - name: Restore from the lock file
        run: dotnet restore SQLServerInteraction.sln --locked-mode

      # A missing XML comment is a warning, so this also fails on an
      # undocumented public member.
      - name: Build Release with warnings as errors
        run: dotnet build SQLServerInteraction.sln --no-restore -c Release -warnaserror

      - name: Pack
        run: dotnet pack SQLServerInteraction.sln --no-build -c Release -o dist

      # nuget.org shows the README and the icon, and IntelliSense reads the
      # XML docs: a package without any of them is a broken release.
      - name: Check the package holds the dll and XML docs, the README and the icon
        run: |
          set -- dist/*.nupkg
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "want exactly one .nupkg, found: $*"; exit 1; }
          unzip -Z1 "$1" > contents.txt
          cat contents.txt
          for ext in dll xml; do
            want="lib/net9.0/SQLServerInteraction.$ext"
            grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
          done
          for want in nugetREADME.md SQLServerInteraction.png; do
            grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: dist/
          if-no-files-found: error

  # The unit tests, and the integration tests against SQL Server 2022 in a
  # container that scripts/test/run-integration-tests.sh builds from
  # .github/test/mssql/Dockerfile, with an SA password made for the run that
  # never leaves the script's environment. --fail-skips turns a skipped test
  # into a failure, so the integration tests cannot pass here by not running.
  test:
    name: Test (unit, and integration on SQL Server 2022)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK comes from global.json. The library and the tests target
      # net9.0, so the .NET 9 runtime comes from the 9.0 SDK named here, an
      # exact release; move it by hand to the newest 9.0 SDK that is a week
      # old (https://dotnet.microsoft.com/download/dotnet/9.0).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.318
          global-json-file: global.json

      - name: Restore from the lock file
        run: dotnet restore SQLServerInteraction.sln --locked-mode

      - name: Build Release
        run: dotnet build SQLServerInteraction.sln --no-restore -c Release

      - name: Run every test against a SQL Server container (fails on a skipped test)
        run: bash scripts/test/run-integration-tests.sh -c Release --no-build --fail-skips on

  # The one check the main ruleset requires. It fails unless every job above
  # passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
